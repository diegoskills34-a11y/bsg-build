name: Build BSG Chronicle DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Preflight Vanilla 2.6 XML and source checks
        shell: powershell
        run: python scripts/preflight_v26.py

      - name: Download and self-update SteamCMD
        shell: powershell
        run: |
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile steamcmd.zip
          Expand-Archive steamcmd.zip -DestinationPath steamcmd -Force
          & .\steamcmd\steamcmd.exe +quit
          # SteamCMD puede devolver 1 cuando termina de auto-actualizarse.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Download 7 Days to Die dedicated server references
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\server" | Out-Null
          $asm = $null
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "SteamCMD intento $i..."
            & .\steamcmd\steamcmd.exe +force_install_dir "$env:GITHUB_WORKSPACE\server" +login anonymous +app_update 294420 validate +quit
            $asm = Get-ChildItem "$env:GITHUB_WORKSPACE\server" -Recurse -Filter Assembly-CSharp.dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $asm) { break }
            Start-Sleep -Seconds 3
            $global:LASTEXITCODE = 0
          }
          if ($null -eq $asm) { throw "Assembly-CSharp.dll no encontrado después de 3 intentos de SteamCMD" }
          Write-Host "Assembly-CSharp: $($asm.FullName)"

      - name: Download compiler references
        shell: powershell
        run: |
          nuget install Lib.Harmony -Version 2.3.3 -OutputDirectory packages -NonInteractive
          nuget install Microsoft.Net.Compilers.Toolset -Version 4.14.0 -OutputDirectory packages -NonInteractive

      - name: Compile DLL
        shell: powershell
        run: .\build.ps1

      - name: Package BSG v0.35 MMO bestiary and title tooltips
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "package/0_BSG_Bestiario" | Out-Null
          Copy-Item "out/bsg_BestiaryChronicle.dll" "package/0_BSG_Bestiario/bsg_BestiaryChronicle.dll" -Force
          New-Item -ItemType Directory -Force -Path "package/0_BSG_Bestiario/Config" | Out-Null
          Copy-Item "assets/BSG_Masteries_Config/buffs.xml" "package/0_BSG_Bestiario/Config/buffs.xml" -Force
          Copy-Item "assets/zzzzzzzz_BSG_Masteries_Tags" -Destination "package/zzzzzzzz_BSG_Masteries_Tags" -Recurse -Force
          Copy-Item "assets/1_BSG_Bestiario_UI" -Destination "package/1_BSG_Bestiario_UI" -Recurse -Force
          # Los retratos PNG son opcionales y se cargan desde UI/Portraits.
          # Un paquete sin assets conserva iconos generados por la DLL.
          if (Test-Path "assets/BSG_Portraits") {
            Copy-Item "assets/BSG_Portraits" -Destination "package/0_BSG_Bestiario/UI/Portraits" -Recurse -Force
          }
          @(
            "BSG v0.35: bestiario estilo MMO, familias con retratos, variantes descubiertas y maestrias visibles.",
            "Al cerrar Personaje, el Bestiario tambien se cierra; no requiere el boton Cerrar.",
            "Se ocultan los identificadores tecnicos de clases C# y XML.",
            "Requisitos y recompensas en el tooltip de cada titulo, incluso bloqueado.",
            "Retratos de familia: opcionales, se ubican en 0_BSG_Bestiario/UI/Portraits/*.png.",
            "Conserva Crónica persistente y maestrias de v0.34.",
            "Sincroniza el titulo equipado que ya estaba desbloqueado con el sistema de maestrias BSG.",
            "Registra en output_log si AddBuff invoca el metodo pero el buff no se activa.",
            "No reanuncia como nuevo un titulo historico recuperado; conserva todos los thresholds y 68 titulos.",
            "Se conserva la configuracion de 16 familias: 10/20/25 dano, 0/5/10 puntos desmembramiento.",
            "Los buffs se vinculan automaticamente a los titulos al cargar el XML, conservando los thresholds y textos.",
            "Backup automatico: playertitles.xml.bsg_before_masteries_v033.bak",
            "Radiados no incluye Tainted. Ante familias superpuestas solo gana el porcentaje mayor.",
            "IMPORTANTE: conservar las 3 carpetas BSG, incluida zzzzzzzz_BSG_Masteries_Tags que carga tras Rebirth.",
            "La actualizacion NO incluye PlayerTitles.dll. Para uso standalone mantener el paquete completo anterior.",
            "PENDIENTE: comprobar el dano real en juego y la ruta del chat. La compilacion no valida mecanicas de combate."
          ) | Set-Content "package/0_BSG_Bestiario/BSG_LEEME_v0.35.txt" -Encoding UTF8
          Compress-Archive -Path "package/0_BSG_Bestiario","package/1_BSG_Bestiario_UI","package/zzzzzzzz_BSG_Masteries_Tags" -DestinationPath "out/BSG_Bestiario_Rebirth26_v0.35_BESTIARIO_MMO.zip" -Force

      - name: Verify packaged ZIP against Vanilla v2.6
        shell: powershell
        run: python scripts/preflight_v26.py --package out/BSG_Bestiario_Rebirth26_v0.35_BESTIARIO_MMO.zip

      - name: Upload BSG update ZIP
        id: upload_package
        uses: actions/upload-artifact@v4
        with:
          name: BSG_Bestiario_Rebirth26_v0.35_BESTIARIO_MMO
          path: out/BSG_Bestiario_Rebirth26_v0.35_BESTIARIO_MMO.zip
          if-no-files-found: error

      - name: Publish build pointer
        shell: powershell
        env:
          BSG_ARTIFACT_ID: ${{ steps.upload_package.outputs.artifact-id }}
          BSG_RUN_ID: ${{ github.run_id }}
          BSG_SOURCE_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path "build-output" | Out-Null
          [pscustomobject]@{
            version = "0.35"
            workflow_run_id = [long]$env:BSG_RUN_ID
            artifact_id = [long]$env:BSG_ARTIFACT_ID
            commit = $env:BSG_SOURCE_SHA
            package_type = "update_dll_buffs_and_late_tags"
          } | ConvertTo-Json | Set-Content -Path "build-output/latest-artifact.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/latest-artifact.json
          git commit -m "ci: record compiled v0.35 package [skip ci]"
          git push origin HEAD:main

