name: Build BSG Chronicle DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download and self-update SteamCMD
        shell: powershell
        run: |
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile steamcmd.zip
          Expand-Archive steamcmd.zip -DestinationPath steamcmd -Force
          & .\steamcmd\steamcmd.exe +quit
          # SteamCMD puede devolver 1 cuando termina de auto-actualizarse.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Download 7 Days to Die dedicated server references
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\server" | Out-Null
          $asm = $null
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "SteamCMD intento $i..."
            & .\steamcmd\steamcmd.exe +force_install_dir "$env:GITHUB_WORKSPACE\server" +login anonymous +app_update 294420 validate +quit
            $asm = Get-ChildItem "$env:GITHUB_WORKSPACE\server" -Recurse -Filter Assembly-CSharp.dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $asm) { break }
            Start-Sleep -Seconds 3
            $global:LASTEXITCODE = 0
          }
          if ($null -eq $asm) { throw "Assembly-CSharp.dll no encontrado después de 3 intentos de SteamCMD" }
          Write-Host "Assembly-CSharp: $($asm.FullName)"

      - name: Download compiler references
        shell: powershell
        run: |
          nuget install Lib.Harmony -Version 2.3.3 -OutputDirectory packages -NonInteractive
          nuget install Microsoft.Net.Compilers.Toolset -Version 4.14.0 -OutputDirectory packages -NonInteractive

      - name: Compile DLL
        shell: powershell
        run: .\build.ps1

      - name: Package BSG v0.20-0.23 update
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "package/0_BSG_Bestiario" | Out-Null
          Copy-Item "out/bsg_BestiaryChronicle.dll" "package/0_BSG_Bestiario/bsg_BestiaryChronicle.dll" -Force
          @'
BSG BESTIARIO - Paquete integrado v0.20 / v0.21 / v0.22 / v0.23
Instalacion: extraer este paquete sobre Mods, sobrescribiendo la DLL.
REQUISITO: mantener el mod existente 0_BSG_Bestiario, con PlayerTitles.dll y sus XML.
No sobrescribe Config/playertitles.xml, buffs.xml, XUi ni thresholds.

F8 abre/cierra la nueva interfaz Bestiario dentro del juego.
Seleccionar una familia con el mouse. AvPag/RePag cambia de familia.
La lista de criaturas solo muestra tipos descubiertos luego de instalar esta version.
Las bajas mostradas son las registradas desde v0.21; NO incluyen las historicas.
Los titulos y sus requisitos siguen siendo gestionados por PlayerTitles.
El registro adicional se guarda en bsg_bestiary_kills.xml en el directorio del mundo.
El estado anterior de maestrias se mantiene en bsg_bestiary_state.xml.
Para diagnostico, buscar [BSG Bestiario] AUDITORIA en el log.

LIMITE ACTUAL: los tests sobre el juego real y dedicado todavia no se realizaron;
la sincronizacion multiplayer de esos contadores queda para v0.24.
'@ | Set-Content -Encoding UTF8 -Path "package/0_BSG_Bestiario/BSG_LEEME_v0.23.txt"
          Compress-Archive -Path "package/0_BSG_Bestiario" -DestinationPath "out/BSG_Bestiario_Rebirth26_v0.20-0.23_ACTUALIZACION.zip" -Force

      - name: Upload BSG update ZIP
        id: upload_package
        uses: actions/upload-artifact@v4
        with:
          name: BSG_Bestiario_Rebirth26_v0.20-0.23_ACTUALIZACION
          path: out/BSG_Bestiario_Rebirth26_v0.20-0.23_ACTUALIZACION.zip
          if-no-files-found: error

      - name: Publish build pointer
        shell: powershell
        env:
          BSG_ARTIFACT_ID: ${{ steps.upload_package.outputs.artifact-id }}
          BSG_RUN_ID: ${{ github.run_id }}
          BSG_SOURCE_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path "build-output" | Out-Null
          [pscustomobject]@{
            version = "0.23"
            workflow_run_id = [long]$env:BSG_RUN_ID
            artifact_id = [long]$env:BSG_ARTIFACT_ID
            commit = $env:BSG_SOURCE_SHA
            package_type = "update_dll_only"
          } | ConvertTo-Json | Set-Content -Path "build-output/latest-artifact.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/latest-artifact.json
          git commit -m "ci: record compiled v0.19 package [skip ci]"
          git push origin HEAD:main

