name: Build BSG Chronicle DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Preflight Vanilla 2.6 XML and source checks
        shell: powershell
        run: python scripts/preflight_v26.py

      - name: Download and self-update SteamCMD
        shell: powershell
        run: |
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile steamcmd.zip
          Expand-Archive steamcmd.zip -DestinationPath steamcmd -Force
          & .\steamcmd\steamcmd.exe +quit
          # SteamCMD puede devolver 1 cuando termina de auto-actualizarse.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Download 7 Days to Die dedicated server references
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\server" | Out-Null
          $asm = $null
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "SteamCMD intento $i..."
            & .\steamcmd\steamcmd.exe +force_install_dir "$env:GITHUB_WORKSPACE\server" +login anonymous +app_update 294420 validate +quit
            $asm = Get-ChildItem "$env:GITHUB_WORKSPACE\server" -Recurse -Filter Assembly-CSharp.dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $asm) { break }
            Start-Sleep -Seconds 3
            $global:LASTEXITCODE = 0
          }
          if ($null -eq $asm) { throw "Assembly-CSharp.dll no encontrado después de 3 intentos de SteamCMD" }
          Write-Host "Assembly-CSharp: $($asm.FullName)"

      - name: Download compiler references
        shell: powershell
        run: |
          nuget install Lib.Harmony -Version 2.3.3 -OutputDirectory packages -NonInteractive
          nuget install Microsoft.Net.Compilers.Toolset -Version 4.14.0 -OutputDirectory packages -NonInteractive

      - name: Compile DLL
        shell: powershell
        run: .\build.ps1

      - name: Package BSG v0.28 controlled clickable Bestiary B
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "package/0_BSG_Bestiario" | Out-Null
          Copy-Item "out/bsg_BestiaryChronicle.dll" "package/0_BSG_Bestiario/bsg_BestiaryChronicle.dll" -Force
          Copy-Item "assets/1_BSG_Bestiario_UI" -Destination "package/1_BSG_Bestiario_UI" -Recurse -Force
          @(
            "BSG v0.28: B con controlador XUiC_SimpleButton, click diagnosticado y sin hotkeys. Crónica v0.27 preservada.",
            "Extraer sobre la carpeta Mods. Mantener 0_BSG_Bestiario de v0.24 con PlayerTitles.dll, Config y XUi originales.",
            "Nueva carpeta 1_BSG_Bestiario_UI/Config/XUi/windows.xml (Vanilla/Rebirth 2.6) agrega un boton B al encabezado del personaje.",
            "Al inicio se corrige el patron XML '<tier ... / reward_damage_pct=...>' y se respalda como .bsg_antes_de_reparar.bak.",
            "Se conservan thresholds y titulos personales. No borra progreso.",
            "Verificar en el log: XML de titulos reparado, Catalogo cargado, Boton de Bestiario conectado y DIAG muerte aceptada.",
            "Limites: no prueba daño por familia, sync multiplayer ni recompensas en ejecucion.",
            "El paquete es una actualizacion NO el mod completo: conservar PlayerTitles.dll, playertitles.xml, buffs.xml y tus thresholds."
          ) | Set-Content "package/0_BSG_Bestiario/BSG_LEEME_v0.28.txt" -Encoding UTF8
          Compress-Archive -Path "package/0_BSG_Bestiario","package/1_BSG_Bestiario_UI" -DestinationPath "out/BSG_Bestiario_Rebirth26_v0.28_BOTON_CONTROLADOR_FIX.zip" -Force

      - name: Verify packaged ZIP against Vanilla v2.6
        shell: powershell
        run: python scripts/preflight_v26.py --package out/BSG_Bestiario_Rebirth26_v0.27_UI_CHAT_HOTFIX.zip

      - name: Upload BSG update ZIP
        id: upload_package
        uses: actions/upload-artifact@v4
        with:
          name: BSG_Bestiario_Rebirth26_v0.27_UI_CHAT_HOTFIX
          path: out/BSG_Bestiario_Rebirth26_v0.27_UI_CHAT_HOTFIX.zip
          if-no-files-found: error

      - name: Publish build pointer
        shell: powershell
        env:
          BSG_ARTIFACT_ID: ${{ steps.upload_package.outputs.artifact-id }}
          BSG_RUN_ID: ${{ github.run_id }}
          BSG_SOURCE_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path "build-output" | Out-Null
          [pscustomobject]@{
            version = "0.28"
            workflow_run_id = [long]$env:BSG_RUN_ID
            artifact_id = [long]$env:BSG_ARTIFACT_ID
            commit = $env:BSG_SOURCE_SHA
            package_type = "update_dll_only"
          } | ConvertTo-Json | Set-Content -Path "build-output/latest-artifact.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/latest-artifact.json
          git commit -m "ci: record compiled v0.28 package [skip ci]"
          git push origin HEAD:main

